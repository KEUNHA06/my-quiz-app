<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244062"><meta name="description" content="엑셀 파일을 불러와 OX 퀴즈와 빈칸 채우기를 연습하는 개인 학습 앱">
<link rel="manifest" href="manifest.json"><title>문제풀이 앱 v2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#244062;color:white;padding:22px 18px 20px}header h1{margin:0;font-size:23px}header p{margin:7px 0 0;color:#dbe6f3;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #e0e6ef;border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 3px 12px #14213b08}.label{font-size:13px;font-weight:700;color:#526176;margin-bottom:8px;display:block}.mode-row,.row{display:flex;gap:9px;flex-wrap:wrap}.mode{flex:1;min-width:125px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:13px;font-weight:700;color:#334155}.mode.active{background:#244062;color:white;border-color:#244062}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:700;font-size:15px;cursor:pointer;background:#244062;color:white}.btn.secondary{background:#e8edf5;color:#24364f}.btn:disabled{opacity:.45;cursor:not-allowed}.full{width:100%}input[type=file]{width:100%;padding:12px;border:1px dashed #9aa9bc;border-radius:12px;background:#f9fbfe}select,input[type=text]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:white}.muted{color:#64748b;font-size:13px;line-height:1.55}.status{font-size:13px;margin-top:10px;white-space:pre-wrap}.question{font-size:20px;font-weight:750;line-height:1.65;margin:12px 0 20px;overflow-wrap:anywhere}.count{font-size:13px;color:#64748b}.ox{display:flex;gap:12px}.ox button{flex:1;padding:20px 10px;font-size:28px;font-weight:800;border-radius:14px;border:1px solid #d5deea;background:white}.ox button:first-child{color:#16834a}.ox button:last-child{color:#c33434}.feedback{margin-top:15px;border-radius:12px;padding:14px;background:#f0f4f9;line-height:1.6}.hidden{display:none!important}.pill{display:inline-block;border-radius:999px;background:#eaf0f8;padding:5px 9px;font-size:12px;color:#405574;margin-right:5px}.stats{display:flex;gap:8px}.stat{flex:1;background:#f5f7fb;border-radius:12px;padding:12px}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:#64748b}.answer-row{display:flex;gap:8px}.answer-row input{flex:1;min-width:0}.foot{font-size:12px;color:#738096;text-align:center;padding:12px 4px 28px}
</style></head>
<body><header><h1>문제풀이 앱 v2</h1><p>엑셀을 불러와 OX 퀴즈와 빈칸 채우기를 연습하세요.</p></header>
<main class="wrap">
<section class="card"><span class="label">1. 문제 엑셀 파일 불러오기</span><input id="file" type="file" accept=".xlsx,.xls"><div id="loadStatus" class="status muted">제공된 엑셀 양식의 OX문제·빈칸문제 시트를 읽습니다.</div><p class="muted">파일은 이 브라우저에서 읽고, 서버로 전송하지 않습니다. 민감한 업무자료는 기관 보안정책에 맞춰 사용하세요.</p></section>
<section class="card"><span class="label">2. 풀이 방식</span><div class="mode-row"><button class="mode active" data-mode="ox">⭕ OX 퀴즈</button><button class="mode" data-mode="blank">✍️ 빈칸 채우기</button></div><div class="row" style="margin-top:14px"><div style="flex:1;min-width:145px"><label class="label" for="subject">분야</label><select id="subject"><option value="all">전체 분야</option></select></div><div style="flex:1;min-width:145px"><label class="label" for="difficulty">난이도</label><select id="difficulty"><option value="all">전체 난이도</option><option>하</option><option>중</option><option>상</option></select></div></div><div class="row" style="margin-top:12px"><button id="start" class="btn full">문제 시작</button></div></section>
<section id="quizCard" class="card hidden"><div class="row" style="justify-content:space-between;align-items:center"><span id="category" class="pill">분야</span><span id="counter" class="count">0 / 0</span></div><div id="question" class="question"></div>
<div id="oxControls" class="ox"><button data-answer="O">O</button><button data-answer="X">X</button></div>
<div id="blankControls" class="hidden"><div class="answer-row"><input id="answer" type="text" placeholder="정답을 입력하세요" autocomplete="off"><button id="check" class="btn">채점</button></div><p class="muted">여러 정답 표현이 등록되어 있다면 허용답안도 정답으로 인정합니다.</p></div>
<div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="row" style="margin-top:14px"><button id="next" class="btn full hidden">다음 문제</button></div></section>
<section id="summary" class="card hidden"><h2 style="margin-top:0">풀이 결과</h2><div class="stats"><div class="stat"><strong id="totalStat">0</strong><span>푼 문제</span></div><div class="stat"><strong id="correctStat">0</strong><span>정답</span></div><div class="stat"><strong id="rateStat">0%</strong><span>정답률</span></div></div><div id="wrongList" style="margin-top:14px"></div><div class="row" style="margin-top:14px"><button id="retryWrong" class="btn full">틀린 문제 다시 풀기</button><button id="restart" class="btn secondary full">전체 다시 풀기</button></div></section>
<div class="foot">문제 데이터는 현재 세션에서만 사용합니다. 이 버전은 엑셀 읽기 라이브러리를 처음 불러올 때 인터넷 연결이 필요합니다.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let mode='ox',ox=[],blank=[],pool=[],session=[],index=0,wrong=[],answered=0,correct=0,locked=false,lastSet=[];
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s.,!?·ㆍ'"“”‘’()\[\]{}:;]/g,'').trim();
function val(row,key){return row[key]===undefined?'':String(row[key]).trim()}
function parseRows(rows,type){return rows.filter(r=>Object.values(r).some(v=>String(v??'').trim())).map((r,i)=>({id:val(r,'문제ID')||`${type}${i+1}`,subject:val(r,'분야')||'기타',question:type==='ox'?val(r,'문제'):val(r,'원문'),answer:val(r,'정답'),allowed:val(r,'허용답안'),explanation:val(r,'해설'),difficulty:val(r,'난이도')||'미지정',type})).filter(q=>q.question&&q.answer)}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!window.XLSX){$('loadStatus').textContent='엑셀 읽기 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 페이지를 새로고침해 주세요.';return}try{const data=await f.arrayBuffer(),book=XLSX.read(data,{type:'array'});const read=name=>{const s=book.Sheets[name];return s?XLSX.utils.sheet_to_json(s,{defval:'',raw:false}):[]};ox=parseRows(read('OX문제'),'ox').filter(q=>['O','X'].includes(q.answer.toUpperCase()));blank=parseRows(read('빈칸문제'),'blank').filter(q=>q.question.includes(q.answer));const subjects=[...new Set([...ox,...blank].map(q=>q.subject))].sort();$('subject').innerHTML='<option value="all">전체 분야</option>'+subjects.map(s=>`<option>${escapeHtml(s)}</option>`).join('');$('loadStatus').textContent=`파일: ${f.name}\nOX 문제 ${ox.length}개 · 빈칸 문제 ${blank.length}개\n${ox.length+blank.length?'불러오기 완료. 풀이 방식을 선택하세요.':'유효한 문제가 없습니다. 시트명과 열 제목, 정답을 확인하세요.'}`;$('summary').classList.add('hidden');$('quizCard').classList.add('hidden')}catch(err){$('loadStatus').textContent='파일을 읽지 못했습니다. 제공된 엑셀 양식인지 확인해 주세요.\n'+err.message}});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('summary').classList.add('hidden');$('quizCard').classList.add('hidden')}));
function filtered(){const src=mode==='ox'?ox:blank,sub=$('subject').value,diff=$('difficulty').value;return src.filter(q=>(sub==='all'||q.subject===sub)&&(diff==='all'||q.difficulty===diff))}
$('start').addEventListener('click',()=>{pool=filtered();if(!pool.length){$('loadStatus').textContent='선택한 조건에 해당하는 문제가 없습니다. 파일을 불러오고 분야·난이도를 확인하세요.';return}startSession(pool)});
function startSession(items){session=[...items];index=0;wrong=[];answered=0;correct=0;locked=false;lastSet=[...items];$('summary').classList.add('hidden');$('quizCard').classList.remove('hidden');showQuestion();$('quizCard').scrollIntoView({behavior:'smooth',block:'start'})}
function showQuestion(){locked=false;const q=session[index];$('category').textContent=q.subject+' · '+q.difficulty;$('counter').textContent=`${index+1} / ${session.length}`;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('oxControls').classList.toggle('hidden',mode!=='ox');$('blankControls').classList.toggle('hidden',mode!=='blank');$('answer').value='';if(mode==='ox')$('question').textContent=q.question;else{$('question').textContent=q.question.replace(q.answer,'□'.repeat(Math.min(8,Math.max(2,[...q.answer].length))));}}
function judge(given){if(locked)return;const q=session[index],ok=mode==='ox'?String(given).toUpperCase()===q.answer.toUpperCase():[q.answer,...q.allowed.split('|').map(s=>s.trim()).filter(Boolean)].some(a=>norm(a)===norm(given));locked=true;answered++;if(ok)correct++;else wrong.push(q);$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'정답입니다!':'다시 확인해 보세요.'}</strong><br>정답: ${escapeHtml(q.answer)}${q.explanation?'<br><br>'+escapeHtml(q.explanation):''}`;$('next').classList.remove('hidden');$('oxControls').querySelectorAll('button').forEach(b=>b.disabled=true);$('check').disabled=true;}
$('oxControls').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>judge(b.dataset.answer)));$('check').addEventListener('click',()=>{if(!$('answer').value.trim()){$('answer').focus();return}judge($('answer').value)});$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});
$('next').addEventListener('click',()=>{if(index<session.length-1){index++;$('oxControls').querySelectorAll('button').forEach(b=>b.disabled=false);$('check').disabled=false;showQuestion()}else finish()});
function finish(){$('quizCard').classList.add('hidden');$('summary').classList.remove('hidden');$('totalStat').textContent=answered;$('correctStat').textContent=correct;$('rateStat').textContent=(answered?Math.round(correct/answered*100):0)+'%';$('wrongList').innerHTML=wrong.length?'<strong>틀린 문제</strong><ol>'+wrong.map(q=>`<li style="margin:8px 0">${escapeHtml(q.question)}<br><span class="muted">정답: ${escapeHtml(q.answer)}</span></li>`).join('')+'</ol>':'모든 문제를 맞혔어요!';$('retryWrong').disabled=!wrong.length;$('summary').scrollIntoView({behavior:'smooth',block:'start'})}
$('retryWrong').addEventListener('click',()=>{if(wrong.length)startSession(wrong)});$('restart').addEventListener('click',()=>startSession(lastSet));
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
