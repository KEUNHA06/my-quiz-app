t-size:11px;color:var(--muted)}.lesson-card strong{font-size:17px}.lesson-card small{color:var(--muted);font-size:12px}.lesson-card .desc{font-size:13px;color:#4d5a52}.pill{display:inline-block;background:var(--mint);color:var(--green2);padding:4px 9px;border-radius:99px;font-size:11px;font-weight:700}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}.back{border:0;background:transparent;color:var(--green2);font-weight:700;padding:4px 0 12px}.lesson-heading{display:flex;gap:12px;align-items:flex-start}.lesson-heading h2{margin:0;font-size:24px}.lesson-heading p{margin:3px 0;color:var(--muted);font-size:13px}.explain{background:#f1f6f2;border-radius:13px;padding:14px;margin:13px 0}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#173c30;color:#f1fff5;border-radius:11px;padding:13px;overflow-wrap:anywhere;font-size:15px}.sheet{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}.sheet th,.sheet td{border:1px solid #dce4de;padding:8px;text-align:center}.sheet th{background:#edf3ee;color:#45564b}.sheet td:first-child{background:#f7f9f7;font-weight:700;color:#5e6c62}.step{display:flex;gap:10px;margin:10px 0;align-items:flex-start}.step b{background:var(--mint);color:var(--green);border-radius:50%;width:25px;height:25px;display:grid;place-items:center;flex:0 0 25px;font-size:12px}.step div{font-size:14px}.muted{color:var(--muted)}.btn{border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px 16px;font-weight:750}.btn.secondary{background:#edf3ee;color:var(--green)}.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.input-label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}.answer-input{width:100%;border:1.5px solid #d5dfd8;border-radius:12px;padding:13px 12px;background:#fff;color:var(--ink);font-family:ui-monospace,monospace;font-size:15px;outline:none}.answer-input:focus{border-color:var(--green2);box-shadow:0 0 0 3px #27634e18}.feedback{padding:12px;border-radius:12px;margin-top:12px;font-size:13px}.feedback.good{background:#eaf5ed;color:#205b38}.feedback.bad{background:#fff2ed;color:#963d2d}.hint{background:#fff8e8;border:1px solid #f0dfb8;color:#725018;border-radius:12px;padding:12px;margin-top:10px;font-size:13px}.small-title{font-size:14px;font-weight:750;margin:15px 0 7px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f3f6f3;border-radius:13px;padding:13px;text-align:center}.stat strong{display:block;font-size:22px;color:var(--green)}.stat span{font-size:11px;color:var(--muted)}.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:14px}.footer{text-align:center;color:#8a958e;font-size:11px;padding:20px 16px}.hidden{display:none!important}
@media(min-width:700px){.hero{margin-top:18px;border-radius:24px;padding:30px}.content{padding:20px 4px}.tabs{padding:18px 4px 4px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.lesson-card{min-height:165px}.app{padding:0 20px 40px}.hero h1{font-size:32px}}

<script>
const lessons = [
 {id:"sum",name:"SUM",ko:"합계 구하기",level:"입문",desc:"여러 숫자를 모두 더해요.",meaning:"SUM은 여러 셀에 들어 있는 숫자를 모두 더해 합계를 구하는 함수예요.",syntax:"=SUM(숫자1, [숫자2], ...)",example:"=SUM(B2:B5)",parts:[["SUM","합계를 구하라는 함수 이름"],["B2:B5","B2부터 B5까지의 셀 범위"]],rows:[["셀","금액"],["B2","10,000"],["B3","20,000"],["B4","15,000"],["B5","5,000"]],result:"50,000",hint:["합계를 구할 때 사용하는 함수 이름은 SUM이에요.","B2부터 B5까지 범위를 콜론(:)으로 연결해요."],question:"B2부터 B5까지 금액의 합계를 구하는 수식을 작성하세요.",answers:["=SUM(B2:B5)"],explain:"SUM은 지정한 범위의 숫자를 모두 더해요. B2:B5는 B2, B3, B4, B5를 뜻해요.",try:"=SUM(B2:B5)"},
 {id:"average",name:"AVERAGE",ko:"평균 구하기",level:"입문",desc:"숫자의 평균을 계산해요.",meaning:"AVERAGE는 숫자들의 산술평균을 구해요. 합계를 항목 수로 나눈 값이에요.",syntax:"=AVERAGE(숫자1, [숫자2], ...)",example:"=AVERAGE(C2:C6)",parts:[["AVERAGE","평균을 구하라는 함수 이름"],["C2:C6","C2부터 C6까지의 점수 범위"]],rows:[["셀","점수"],["C2","80"],["C3","90"],["C4","70"],["C5","85"],["C6","95"]],result:"84",hint:["평균을 구하는 함수 이름은 AVERAGE예요.","점수가 입력된 C2부터 C6까지 범위를 지정하세요."],question:"C2부터 C6까지 점수의 평균을 구하는 수식을 작성하세요.",answers:["=AVERAGE(C2:C6)"],explain:"AVERAGE는 지정한 숫자들의 평균을 구해요. 이 예시의 평균은 84점이에요.",try:"=AVERAGE(C2:C6)"},
 {id:"maxmin",name:"MAX / MIN",ko:"최댓값과 최솟값",level:"입문",desc:"가장 큰 값과 가장 작은 값을 찾아요.",meaning:"MAX는 가장 큰 숫자를, MIN은 가장 작은 숫자를 찾아줘요.",syntax:"=MAX(범위)  /  =MIN(범위)",example:"=MAX(D2:D6)",parts:[["MAX","가장 큰 숫자"],["MIN","가장 작은 숫자"],["D2:D6","비교할 숫자 범위"]],rows:[["셀","점수"],["D2","72"],["D3","98"],["D4","81"],["D5","65"],["D6","90"]],result:"MAX = 98 / MIN = 65",hint:["가장 큰 값은 MAX, 가장 작은 값은 MIN이에요.","두 함수 모두 같은 범위 D2:D6을 사용할 수 있어요."],question:"D2부터 D6까지 점수 중 가장 큰 값을 구하는 수식을 작성하세요.",answers:["=MAX(D2:D6)"],explain:"MAX는 범위에서 가장 큰 숫자를 반환해요. 가장 작은 값이 필요하다면 MAX 대신 MIN을 사용해요.",try:"=MAX(D2:D6)"},
 {id:"count",name:"COUNT / COUNTA",ko:"데이터 개수 세기",level:"입문",desc:"숫자 또는 비어 있지 않은 셀의 개수를 세요.",meaning:"COUNT는 숫자가 입력된 셀의 개수를 세고, COUNTA는 비어 있지 않은 셀의 개수를 세요.",syntax:"=COUNT(범위)  /  =COUNTA(범위)",example:"=COUNT(A2:A6)",parts:[["COUNT","숫자가 입력된 셀 개수"],["COUNTA","비어 있지 않은 셀 개수"],["A2:A6","확인할 범위"]],rows:[["셀","내용"],["A2","김하나"],["A3","25"],["A4","이둘"],["A5","30"],["A6","(빈 셀)"]],result:"COUNT = 2 / COUNTA = 4",hint:["숫자만 세려면 COUNT를 사용해요.","글자까지 포함해 내용이 있는 셀을 세려면 COUNTA를 사용해요."],question:"A2부터 A6까지에서 숫자가 입력된 셀의 개수를 구하는 수식을 작성하세요.",answers:["=COUNT(A2:A6)"],explain:"COUNT는 숫자가 있는 A3과 A5, 총 2개를 세요. 글자도 세고 싶다면 COUNTA를 사용해요.",try:"=COUNT(A2:A6)"},
 {id:"if",name:"IF",ko:"조건에 따라 결과 표시",level:"기초",desc:"조건이 참인지 거짓인지에 따라 다른 결과를 표시해요.",meaning:"IF는 조건을 검사한 뒤 참이면 첫 번째 결과를, 거짓이면 두 번째 결과를 표시해요.",syntax:'=IF(조건, "참일 때", "거짓일 때")',example:'=IF(B2>=60,"합격","불합격")',parts:[["B2>=60","B2의 값이 60 이상인지 검사"],["\"합격\"","조건이 참이면 표시"],["\"불합격\"","조건이 거짓이면 표시"]],rows:[["셀","점수"],["B2","75"],["B3","55"]],result:"B2 결과 = 합격",hint:["IF 함수는 조건, 참일 때 결과, 거짓일 때 결과 순서예요.","60점 이상인지 비교하려면 >= 기호를 사용해요."],question:"B2의 점수가 60점 이상이면 '합격', 아니면 '불합격'을 표시하는 수식을 작성하세요.",answers:['=IF(B2>=60,"합격","불합격")',"=IF(B2>=60,\"합격\",\"불합격\")"],explain:"IF(조건, 참일 때 값, 거짓일 때 값) 순서예요. 문자 결과는 큰따옴표로 감싸야 해요.",try:'=IF(B2>=60,"합격","불합격")'},
 {id:"andor",name:"AND / OR",ko:"여러 조건 판단",level:"기초",desc:"조건을 모두 만족하거나 하나만 만족해도 되는지 판단해요.",meaning:"AND는 모든 조건이 참이어야 TRUE, OR는 조건 중 하나라도 참이면 TRUE를 반환해요. IF와 함께 자주 사용해요.",syntax:"=AND(조건1, 조건2)  /  =OR(조건1, 조건2)",example:'=IF(AND(B2>=60,C2="출석"),"통과","미통과")',parts:[["AND(B2>=60,C2=\"출석\")","점수가 60 이상이고 출석 상태가 출석인지 모두 확인"],["IF(...)","조건이 참이면 통과, 아니면 미통과"]],rows:[["셀","값"],["B2","80"],["C2","출석"]],result:"통과",hint:["AND는 두 조건을 모두 만족해야 해요.","IF 안에 AND(조건1, 조건2)를 넣어 사용할 수 있어요."],question:"B2가 60 이상이고 C2가 '출석'이면 '통과', 아니면 '미통과'를 표시하세요.",answers:['=IF(AND(B2>=60,C2="출석"),"통과","미통과")'],explain:"AND가 두 조건을 검사하고, 그 결과를 IF가 받아 최종 문자를 표시해요.",try:'=IF(AND(B2>=60,C2="출석"),"통과","미통과")'},
 {id:"countif",name:"COUNTIF",ko:"조건에 맞는 개수",level:"기초",desc:"조건에 맞는 셀이 몇 개인지 세요.",meaning:"COUNTIF는 지정한 범위에서 조건에 맞는 셀의 개수를 세는 함수예요.",syntax:"=COUNTIF(범위, 조건)",example:'=COUNTIF(B2:B6,">=80")',parts:[["B2:B6","조건을 검사할 범위"],[">=80","80 이상이라는 조건"]],rows:[["셀","점수"],["B2","90"],["B3","75"],["B4","80"],["B5","60"],["B6","95"]],result:"3",hint:["COUNTIF는 범위와 조건, 두 가지를 입력해요.","80 이상 조건은 따옴표 안에 \">=80\"처럼 작성해요."],question:"B2부터 B6까지에서 80 이상인 점수의 개수를 구하세요.",answers:['=COUNTIF(B2:B6,">=80")',"=COUNTIF(B2:B6,\">=80\")"],explain:"90, 80, 95가 조건을 만족하므로 결과는 3이에요. 조건을 큰따옴표로 묶는 점을 기억하세요.",try:'=COUNTIF(B2:B6,">=80")'},
 {id:"sumif",name:"SUMIF",ko:"조건에 맞는 합계",level:"기초",desc:"조건에 맞는 항목의 숫자만 더해요.",meaning:"SUMIF는 조건을 만족하는 행에 대응하는 숫자들을 합산해요.",syntax:"=SUMIF(조건범위, 조건, 합계범위)",example:'=SUMIF(A2:A5,"사과",B2:B5)',parts:[["A2:A5","조건을 확인할 품목 범위"],["\"사과\"","찾을 조건"],["B2:B5","합계를 구할 금액 범위"]],rows:[["셀","품목(A)","금액(B)"],["2","사과","1,000"],["3","배","2,000"],["4","사과","1,500"],["5","포도","3,000"]],result:"2,500",hint:["SUMIF는 조건범위, 조건, 합계범위 순서예요.","품목이 사과인 행의 금액을 더하는 문제예요."],question:"A2:A5에서 '사과'인 행에 해당하는 B2:B5 금액의 합계를 구하세요.",answers:['=SUMIF(A2:A5,"사과",B2:B5)'],explain:"사과에 해당하는 금액 1,000과 1,500을 더해 2,500이 돼요.",try:'=SUMIF(A2:A5,"사과",B2:B5)'},
 {id:"text",name:"LEFT / RIGHT / MID",ko:"문자 추출하기",level:"기초",desc:"문자열의 왼쪽·오른쪽·중간 글자를 가져와요.",meaning:"LEFT는 왼쪽부터, RIGHT는 오른쪽부터, MID는 지정한 위치부터 글자를 추출해요.",syntax:"=LEFT(문자열, 글자수)\n=RIGHT(문자열, 글자수)\n=MID(문자열, 시작위치, 글자수)",example:'=LEFT(A2,2)  → "서울"',parts:[["A2","문자열이 들어 있는 셀"],["2","왼쪽에서 가져올 글자 수"],["MID","시작 위치와 글자 수를 지정해 중간 추출"]],rows:[["셀","내용"],["A2","서울특별시"],["LEFT(A2,2)","서울"],["RIGHT(A2,3)","특별시"]],result:"서울",hint:["LEFT와 RIGHT는 가져올 글자 수를 지정해요.","MID는 시작 위치도 지정해야 해요. 첫 글자의 위치는 1이에요."],question:"A2의 문자열에서 왼쪽부터 2글자를 추출하는 수식을 작성하세요.",answers:["=LEFT(A2,2)"],explain:"LEFT(A2,2)는 A2의 왼쪽에서 두 글자를 가져와요. 서울특별시라면 결과는 서울이에요.",try:"=LEFT(A2,2)"},
 {id:"vlookup",name:"VLOOKUP",ko:"표에서 값 찾기",level:"도전",desc:"표의 첫 번째 열에서 값을 찾아 같은 행의 다른 열 값을 가져와요.",meaning:"VLOOKUP은 표의 첫 번째 열에서 찾을 값을 검색하고, 지정한 열의 값을 반환해요.",syntax:"=VLOOKUP(찾을값, 표범위, 열번호, 일치옵션)",example:"=VLOOKUP(E2,A2:C6,3,FALSE)",parts:[["E2","찾을 값이 입력된 셀"],["A2:C6","검색할 표 범위"],["3","표 범위의 세 번째 열에서 결과 반환"],["FALSE","정확히 일치하는 값 검색"]],rows:[["사번","이름","부서"],["101","김하나","총무"],["102","이둘","회계"],["103","박셋","인사"]],result:"찾을 사번이 102라면 결과 = 회계",hint:["찾을 값은 표 범위의 첫 번째 열에서 검색해요.","열번호 3은 지정한 표 범위의 세 번째 열을 뜻해요. 정확히 일치하려면 FALSE를 사용해요."],question:"E2의 사번을 A2:C6에서 찾아 세 번째 열의 값을 정확히 일치하도록 가져오세요.",answers:["=VLOOKUP(E2,A2:C6,3,FALSE)","=VLOOKUP(E2,A2:C6,3,0)"],explain:"VLOOKUP(찾을값, 표범위, 열번호, FALSE) 구조예요. FALSE 대신 0을 써도 정확히 일치하는 검색이에요.",try:"=VLOOKUP(E2,A2:C6,3,FALSE)"}
];
const defaultState={completed:[],attempts:0,correct:0,wrong:{},lastSeen:null};
let state;
try{state=JSON.parse(localStorage.getItem("comhwalFunctionTrainerV1"))||structuredClone(defaultState)}catch(e){state={...defaultState}}
let activeTab="learn", currentLesson=null, hintLevel=0;
const $=s=>document.querySelector(s);
function save(){localStorage.setItem("comhwalFunctionTrainerV1",JSON.stringify(state));updateHeader()}
function updateHeader(){const n=state.completed.length;$("#heroProgressText").textContent=`학습 완료 ${n} / ${lessons.length}`;$("#heroProgress").style.width=(n/lessons.length*100)+"%"}
function showTab(tab){activeTab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));["learn","lesson","practice","wrong","stats"].forEach(v=>$("#"+v+"View").classList.toggle("hidden",v!==(tab==="learn"&&currentLesson?"lesson":tab)));if(tab==="learn"&&!currentLesson)renderLessons();if(tab==="practice")renderPractice();if(tab==="wrong")renderWrong();if(tab==="stats")renderStats()}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{currentLesson=null;showTab(b.dataset.tab)}));
function renderLessons(){const grid=$("#lessonGrid");grid.innerHTML="";lessons.forEach((l,i)=>{const done=state.completed.includes(l.id);const b=document.createElement("button");b.className="card lesson-card";b.innerHTML=`<div class="lesson-top"><span class="num">${String(i+1).padStart(2,"0")} · ${l.level}</span><span class="status">${done?"✓ 학습 완료":"학습 전"}</span></div><strong>${l.name}</strong><span class="desc">${l.ko}</span><small>${l.desc}</small>`;b.addEventListener("click",()=>openLesson(l.id));grid.appendChild(b)})}
function table(rows){return `<table class="sheet"><tbody>${rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function openLesson(id){currentLesson=lessons.find(x=>x.id===id);hintLevel=0;renderLesson();showTab("learn")}
function renderLesson(){const l=currentLesson,v=$("#lessonView");$("#learnView").classList.add("hidden");v.classList.remove("hidden");v.innerHTML=`<button class="back" id="backLessons">← 함수 목록</button><div class="panel"><div class="lesson-heading"><span class="pill">${l.level} 단계</span><div><h2>${l.name}</h2><p>${l.ko}</p></div></div><div class="explain"><b>🌱 이 함수는 무엇을 할까요?</b><p style="margin:6px 0 0">${l.meaning}</p></div><div class="small-title">함수의 기본 모양</div><div class="formula">${l.syntax.replaceAll("\\n","<br>")}</div><div class="small-title">실제 예시</div><div class="formula">${l.example}</div>${l.rows?`<div class="small-title">예제 데이터</div>${table(l.rows)}`:""}<div class="small-title">수식 하나씩 이해하기</div>${l.parts.map((p,i)=>`<div class="step"><b>${i+1}</b><div><strong>${p[0]}</strong><br><span class="muted">${p[1]}</span></div></div>`).join("")}<div class="explain"><b>계산 결과</b><div style="font-size:19px;font-weight:800;color:var(--green);margin-top:5px">${l.result}</div></div><div class="small-title">이제 직접 만들어 볼까요?</div><p class="muted" style="font-size:13px">아래 문제를 읽고 수식을 입력해 보세요. 처음에는 힌트를 사용해도 좋아요.</p><b>${l.question}</b><label class="input-label" for="lessonAnswer">수식 입력</label><input id="lessonAnswer" class="answer-input" placeholder="예: =SUM(A1:A5)" autocomplete="off" autocapitalize="characters"><div class="btn-row"><button class="btn secondary" id="hintBtn">힌트 보기</button><button class="btn" id="checkBtn">정답 확인</button></div><div id="hintArea"></div><div id="answerFeedback"></div><div class="btn-row"><button class="btn ghost" id="nextLesson">다음 함수 배우기 →</button></div></div>`;
$("#backLessons").onclick=()=>{currentLesson=null;showTab("learn")};$("#hintBtn").onclick=()=>{hintLevel=Math.min(hintLevel+1,2);$("#hintArea").innerHTML=`<div class="hint">💡 ${l.hint[Math.min(hintLevel-1,1)]}</div>`};$("#checkBtn").onclick=()=>checkAnswer(l,$("#lessonAnswer").value,"answerFeedback");$("#lessonAnswer").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer(l,e.target.value,"answerFeedback")});$("#nextLesson").onclick=()=>{const i=lessons.findIndex(x=>x.id===l.id);openLesson(lessons[(i+1)%lessons.length].id)}}
function normalize(s){return s.toUpperCase().replace(/\s+/g,"").replace(/;/g,",")}
function checkAnswer(l,value,target){const correct=l.answers.some(a=>normalize(a)===normalize(value));state.attempts++;if(correct){state.correct++;if(!state.completed.includes(l.id))state.completed.push(l.id);delete state.wrong[l.id];$("#"+target).innerHTML=`<div class="feedback good"><b>정답이에요! 🎉</b><br>${l.explain}</div>`}else{state.wrong[l.id]=(state.wrong[l.id]||0)+1;$("#"+target).innerHTML=`<div class="feedback bad"><b>조금 더 살펴봐요.</b><br>입력한 수식의 함수 이름, 괄호, 셀 범위를 확인해 보세요.<br><br><b>정답 예시:</b> <code>${l.try}</code><br>${l.explain}</div>`}save();renderLessons()}
function renderPractice(){const box=$("#practiceList");box.innerHTML="";lessons.forEach((l,i)=>{const p=document.createElement("div");p.className="panel";p.innerHTML=`<span class="pill">${i+1}번 · ${l.level}</span><h3 style="margin:9px 0 4px">${l.name} — ${l.ko}</h3><p style="font-size:13px;margin:0">${l.question}</p><input class="answer-input" style="margin-top:11px" id="p_${l.id}" placeholder="수식을 입력하세요"><div class="btn-row"><button class="btn secondary" data-hint="${l.id}">힌트</button><button class="btn" data-check="${l.id}">채점</button></div><div id="pf_${l.id}"></div><div id="ph_${l.id}"></div>`;box.appendChild(p)});box.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>checkAnswer(lessons.find(l=>l.id===b.dataset.check),$("#p_"+b.dataset.check).value,"pf_"+b.dataset.check));box.querySelectorAll("[data-hint]").forEach(b=>{let n=0;b.onclick=()=>{n=Math.min(n+1,2);$("#ph_"+b.dataset.hint).innerHTML=`<div class="hint">${lessons.find(l=>l.id===b.dataset.hint).hint[n-1]}</div>`}})}
function renderWrong(){const box=$("#wrongList"),ids=Object.keys(state.wrong);if(!ids.length){box.innerHTML='<div class="panel empty">아직 오답이 없어요.<br>함수 연습을 시작하면 복습할 문제가 여기에 모여요! 🌱</div>';return}box.innerHTML="";ids.forEach(id=>{const l=lessons.find(x=>x.id===id);if(!l)return;const p=document.createElement("div");p.className="panel";p.innerHTML=`<span class="pill">오답 ${state.wrong[id]}회</span><h3>${l.name} · ${l.ko}</h3><p style="font-size:13px">${l.question}</p><input class="answer-input" id="w_${id}" placeholder="수식을 다시 입력하세요"><div class="btn-row"><button class="btn" id="wc_${id}">다시 채점</button><button class="btn ghost" id="wh_${id}">정답 보기</button></div><div id="wf_${id}"></div>`;box.appendChild(p);$("#wc_"+id).onclick=()=>checkAnswer(l,$("#w_"+id).value,"wf_"+id);$("#wh_"+id).onclick=()=>$("#wf_"+id).innerHTML=`<div class="hint">정답 예시: ${l.try}<br>${l.explain}</div>`})}
function renderStats(){const rate=state.attempts?Math.round(state.correct/state.attempts*100):0;$("#statsGrid").innerHTML=`<div class="stat"><strong>${state.completed.length}</strong><span>학습 완료 함수</span></div><div class="stat"><strong>${state.attempts}</strong><span>누적 채점</span></div><div class="stat"><strong>${rate}%</strong><span>정답률</span></div>`;$("#statsDetails").innerHTML=lessons.map(l=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px"><span><b>${l.name}</b> <span class="muted">· ${l.ko}</span></span><span>${state.completed.includes(l.id)?"✓ 완료":"학습 전"}</span></div>`).join("")}
$("#resetBtn").onclick=()=>{if(confirm("모든 학습 기록과 오답을 초기화할까요?")){state={...defaultState,completed:[],wrong:{}};save();renderStats();renderLessons()}};
renderLessons();updateHeader();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
